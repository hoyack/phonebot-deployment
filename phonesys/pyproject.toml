[project]
name = "phonesys"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=14.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: requires real Asterisk ARI, Hermes, Deepgram and/or ElevenLabs reachable on the network; opt-in only, run with `-m live`.",
]
# --strict-markers: an unregistered @pytest.mark.* now errors instead of being
# silently accepted (there was no existing pytest.mark usage in tests/ at the
# time this was added, so this cannot break the current suite).
# -m "not live": deselects the live tier by default so the plain `pytest -q`
# run used for extension 7000 never depends on real infrastructure. Passing
# `-m live` on the command line overrides this (both are `-m`, and pytest
# appends addopts before explicit CLI args, so the CLI value wins) --
# selecting the live tier instead of adding to it.
addopts = ["--strict-markers", "-m", "not live"]
