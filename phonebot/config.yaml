# Reference policy, not a credential-bearing deployable profile.
# Apply with `hermes -p phonebot config set ...` as documented in docs/SETUP.md.
# Select provider/model independently with `hermes -p phonebot model`.
gateway:
  multiplex_profiles: false
memory:
  memory_enabled: false
  user_profile_enabled: false
mcp_servers: {}
platform_toolsets:
  api_server:
    - safe
